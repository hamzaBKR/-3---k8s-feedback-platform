apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


images:
    - name: hamzabaker/docker-vote-app
      newTag: 8b553f829b16d9bfb0ce2cbcd02b9995b7a2f17e

    - name: hamzabaker/docker-result-app
      newTag: 8b553f829b16d9bfb0ce2cbcd02b9995b7a2f17e

    - name: hamzabaker/docker-worker
      newTag: 8b553f829b16d9bfb0ce2cbcd02b9995b7a2f17e


resources:
