apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: feedback-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:

    metadata:
      labels:
        app: redis

    spec:
      containers:
      - name: redis

        image: redis:7-alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "300m"
            memory: "256Mi"
        ports:
        - containerPort: 6379
