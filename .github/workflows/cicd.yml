name: CI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infrastructure/kubernetes/base/kustomization.yaml'

permissions:
  contents: write
  security-events: write


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Docker Buildx for better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      # Build all images with caching
      - name: Build and Push Vote App
        uses: docker/build-push-action@v5
        with:
          context: ./apps/vote-app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-vote-app:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/docker-vote-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Vote App
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/docker-vote-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-vote.sarif'

      - name: Build and Push Result App
        uses: docker/build-push-action@v5
        with:
          context: ./apps/result-app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-result-app:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/docker-result-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Result App
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/docker-result-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-result.sarif'

      - name: Build and Push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-worker:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/docker-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/docker-worker:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-worker.sarif'

      - name: Upload Vote SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-vote.sarif
          category: vote-app

      - name: Upload Result SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-result.sarif
          category: result-app

      - name: Upload Worker SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-worker.sarif
          category: worker


      - name: Update image tags
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "/docker-vote-app/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml

          sed -i "/docker-result-app/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml

          sed -i "/docker-worker/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml

    

      - name: Generate build report
        run: |
          echo "Commit: ${GITHUB_SHA}" > deployment-report.txt
          echo "Vote App: ${{ secrets.DOCKER_USERNAME }}/docker-vote-app:${GITHUB_SHA}" >> deployment-report.txt
          echo "Result App: ${{ secrets.DOCKER_USERNAME }}/docker-result-app:${GITHUB_SHA}" >> deployment-report.txt
          echo "Worker: ${{ secrets.DOCKER_USERNAME }}/docker-worker:${GITHUB_SHA}" >> deployment-report.txt

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment-report.txt

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-results-vote.sarif
            trivy-results-result.sarif
            trivy-results-worker.sarif


      - name: Update image tags
        if: github.ref == 'refs/heads/main'
        run: |
            sed -i "/docker-vote-app/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml

            sed -i "/docker-result-app/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml

            sed -i "/docker-worker/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" infrastructure/kubernetes/base/kustomization.yaml


      - name: Deployment Summary
        run: |
          echo "Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "Vote App built successfully" >> $GITHUB_STEP_SUMMARY
          echo "Result App built successfully" >> $GITHUB_STEP_SUMMARY
          echo "Worker built successfully" >> $GITHUB_STEP_SUMMARY

      - name: Commit updated manifests
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add infrastructure/kubernetes/base/kustomization.yaml

          git diff --staged --quiet || \
          git commit -m "Update images to ${GITHUB_SHA}"

          git push
