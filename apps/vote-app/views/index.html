<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .container {
      background: white;
      width: 800px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 30px;
    }

    .ratings {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .rating {
      text-align: center;
    }

    .emoji-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      font-size: 40px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .emoji-btn:hover {
      transform: scale(1.1);
    }

    .very-good { background: #57c84d; }
    .good { background: #8ac926; }
    .neutral { background: #ffca3a; }
    .bad { background: #ff924c; }
    .very-bad { background: #ff595e; }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
      margin-bottom: 20px;
    }

    .submit-btn {
      background: #0077ff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <div class="container">

    <h2>How satisfied are you with our service?</h2>

    <form action="/vote" method="POST">

      <div class="ratings">

        <div class="rating">
          <button class="emoji-btn very-good" name="rating" value="very_satisfied">😊</button>
          <p>Very Satisfied</p>
        </div>

        <div class="rating">
          <button class="emoji-btn good" name="rating" value="satisfied">🙂</button>
          <p>Satisfied</p>
        </div>

        <div class="rating">
          <button class="emoji-btn neutral" name="rating" value="neutral">😐</button>
          <p>Neutral</p>
        </div>

        <div class="rating">
          <button class="emoji-btn bad" name="rating" value="unsatisfied">🙁</button>
          <p>Unsatisfied</p>
        </div>

        <div class="rating">
          <button class="emoji-btn very-bad" name="rating" value="very_unsatisfied">😡</button>
          <p>Very Unsatisfied</p>
        </div>

      </div>

      <textarea
        name="comment"
        placeholder="Tell us more about your experience..."
      ></textarea>

      <br>

      <button class="submit-btn" type="submit">
        Submit Feedback
      </button>

    </form>

  </div>

</body>
</html>
